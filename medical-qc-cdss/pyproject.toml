[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qc-cdss"
version = "0.1.0"
description = "病历内涵质控与临床决策支持平台（规则前置 + vLLM 推理 + 确定性证据溯源）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Liu Yuhao" }]
keywords = ["medical", "llm", "rag", "qc", "cdss", "vllm"]

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "openai>=1.54,<2.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "aiosqlite>=0.20,<1.0",
  "redis>=5.2,<7.0",
  "langgraph>=0.2.60,<2.0",
  "pymilvus>=2.5,<3.0",
  "rapidfuzz>=3.10,<4.0",
  "structlog>=24.4,<26.0",
  "prometheus-client>=0.21,<1.0",
  "PyJWT>=2.9,<3.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
mysql = ["asyncmy>=0.2.9,<1.0"]
chroma = ["chromadb>=0.5.20,<2.0"]
migration = ["alembic>=1.14,<2.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "alembic>=1.14,<2.0",
]

[project.scripts]
qc-cdss = "qc_cdss.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_cdss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
