name: qc-cdss

services:
  api:
    build:
      context: .
    image: qc-cdss:0.1.0
    env_file:
      - path: .env
        required: false
    environment:
      QC_DATA_DIR: /app/data
      QC_REDIS_URL: redis://redis:6379/0
      QC_DATABASE_URL: ${QC_DATABASE_URL:-sqlite+aiosqlite:////app/data/qc_cdss.db}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- 可选：MySQL
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: qc_cdss
      MYSQL_USER: qc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qc_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=300
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqc", "-p${MYSQL_PASSWORD:-qc_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------- 可选：Milvus
  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- 可选：vLLM
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.10.0
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_USE_V1: "1"
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      - --served-model-name
      - ${QC_LLM_MODEL:-Qwen2.5-32B-Instruct-AWQ}
      - --quantization
      - awq
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --disable-log-requests
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ---------------------------------------------------------------- 可选：网关
  nginx:
    profiles: ["gateway"]
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  hf_cache:
